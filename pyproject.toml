[project]
name = "furious-2-ml-collab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bisma Munir", email = "bismamunir474@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dvc[gdrive]>=3.67.1",
    "joblib>=1.6.0",
    "jupytext>=1.19.5",
    "nbstripout>=0.9.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
    "scikit-learn>=1.9.1",
]
[tool.uv]
package = false


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# stage scripts put the project root on sys.path before importing src.*
"src/*.py" = ["E402"]
